
<!DOCTYPE html>
<html lang="mg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fisoratana anarana</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eaf0ff;
      padding: 20px 12px;
    }
    .formulaire {
      background: white;
      max-width: 420px;
      margin: auto;
      padding: 22px;
      border-radius: 18px;
      box-shadow: 0 4px 18px #c5d0e5;
    }
    h1 { color: #2457d6; text-align: center; }
    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #ccd2df;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #2457d6;
      color: white;
      font-size: 17px;
    }
    #valiny {
      text-align: center;
      color: #087443;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="formulaire">
    <h1>Fisoratana anarana</h1>
    <p>Fenoy ny mombamomba anao.</p>

    <form id="inscription">
      <label>Anarana feno</label>
      <input id="anarana" type="text" required>

      <label>Adiresy mailaka</label>
      <input id="email" type="email" required>

      <label>Laharana finday</label>
      <input id="telefaonina" type="tel" required>

      <label>Taona</label>
      <input id="taona" type="number" min="1" max="120" required>

      <label>Sexe</label>
      <select id="sexe" required>
        <option value="">Safidio</option>
        <option>Masculin</option>
        <option>Féminin</option>
      </select>

<label for="cin">Numéro CIN</label>
<input type="text" id="cin" name="cin" placeholder="Ampidiro ny laharana CIN" required>

<label for="date_naissance">Date de naissance</label>
<input type="date" id="date_naissance" name="date_naissance" required>

<label for="asa">Asa atao</label>
<input type="text" id="asa" name="asa" placeholder="Asa ataonao" required>

<label for="adresse">Adresse</label>
<input type="text" id="adresse" name="adresse" placeholder="Adiresinao" required>

<label for="sary">Sary tapaka</label>
<input type="file" id="sary" name="sary" accept="image/*" required>
      
      <button type="submit">Hisoratra anarana</button>
    </form>

    <p id="valiny"></p>
  </div>

  
<script>
  const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbwSJJl4uO5eq9drBJegq5dx-GWR5VDmI-f1Nq-uEidRWlk6HQqlZZlpHJG-VeWnug94xw/exec";
  
document.getElementById("inscription")
  .addEventListener("submit", async function(e) {
    e.preventDefault();

    const inputSary = document.getElementById("sary");
    const rakitraSary = inputSary.files[0];

    if (!rakitraSary) {
      document.getElementById("valiny").innerText =
        "Misafidiana sary aloha.";
      return;
    }

    if (rakitraSary.size > 2 * 1024 * 1024) {
      document.getElementById("valiny").innerText =
        "Lehibe loatra ilay sary. Mifidiana sary latsaky ny 2 Mo.";
      return;
    }

    const saryBase64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(rakitraSary);
    });

    const donnees = {
      anarana: document.getElementById("anarana").value.trim(),
      email: document.getElementById("email").value.trim(),
      telefaonina: document.getElementById("telefaonina").value.trim(),
      taona: document.getElementById("taona").value,
      sexe: document.getElementById("sexe").value,
      cin: document.getElementById("cin").value.trim(),
      date_naissance: document.getElementById("date_naissance").value,
      asa: document.getElementById("asa").value.trim(),
      adresse: document.getElementById("adresse").value.trim(),
      saryBase64: saryBase64,
      saryType: rakitraSary.type || "image/jpeg",
      saryNom: rakitraSary.name
    };

    document.getElementById("valiny").innerText =
      "Eo am-pandefasana...";

    fetch(URL_WEB_APP, {
      method: "POST",
      body: JSON.stringify(donnees)
    })
    .then(response => response.json())
    .then(resultat => {
      if (resultat.succes) {
        document.getElementById("valiny").innerText =
          "Vita ny fandefasana, voatahiry ny sary.";
        document.getElementById("inscription").reset();
      } else {
        document.getElementById("valiny").innerText =
          "Nisy olana: " + (resultat.erreur || "Tsy voatahiry ny angona.");
      }
    })
    .catch(() => {
      document.getElementById("valiny").innerText =
        "Tsy voamarina ny valin'ny fandefasana. Jereo ny Google Sheets sy Drive.";
    });
});

  </script>
</body>
</html>
